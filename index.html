<script>

const SUPABASE_URL =

/* =========================
   PAGE
========================= */

function showPage(page){

  document.querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document.getElementById(page)
    .classList.add("active");

  if(page==="home") loadUsers();
  if(page==="profile") loadMyProfile();

  window.scrollTo(0,0);
}


/* =========================
   MESSAGE BOX
========================= */

function msg(id,text,type){

  const el=document.getElementById(id);

  el.textContent=text;
  el.className="message "+type;
  el.style.display="block";
}


/* =========================
   REGISTER
========================= */

async function register(){

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const location=document.getElementById("location").value.trim();
  const bio=document.getElementById("bio").value.trim();
  const password=document.getElementById("password").value;

  if(!name || !email || !password){

    msg(
      "registerMsg",
      "Please fill in name, email and password.",
      "err"
    );

    return;
  }

  if(password.length<6){

    msg(
      "registerMsg",
      "Password must be at least 6 characters.",
      "err"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    msg("registerMsg",error.message,"err");
    return;
  }

  if(!data.user){

    msg(
      "registerMsg",
      "Check your email to confirm your account.",
      "ok"
    );

    return;
  }

  const {error:profileError} =
    await supabaseClient
    .from("profiles")
    .insert({
      id:data.user.id,
      name,
      email,
      location,
      bio
    });

  if(profileError){

    msg(
      "registerMsg",
      "Account created but profile failed: "+
      profileError.message,
      "err"
    );

    return;
  }

  msg(
    "registerMsg",
    "Account created successfully! 🎉",
    "ok"
  );

  setTimeout(()=>{
    showPage("profile");
  },1200);
}


/* =========================
   LOGIN
========================= */

async function login(){

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!email || !password){

    msg(
      "loginMsg",
      "Enter email and password.",
      "err"
    );

    return;
  }

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    msg("loginMsg",error.message,"err");
    return;
  }

  msg(
    "loginMsg",
    "Login successful! 🎉",
    "ok"
  );

  setTimeout(()=>{
    showPage("profile");
  },800);
}


/* =========================
   USERS
========================= */

let profiles=[];

async function loadUsers(){

  const box=document.getElementById("users");

  const {data,error} =
    await supabaseClient
    .from("profiles")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    box.innerHTML=
      '<div class="empty">Unable to load users.</div>';

    console.error(error);
    return;
  }

  profiles=data || [];

  displayUsers(profiles);
}


function displayUsers(list){

  const box=document.getElementById("users");

  if(!list.length){

    box.innerHTML=
      '<div class="empty">No users have joined NEXA yet.</div>';

    return;
  }

  box.innerHTML=list.map(user=>{

    const initial=
      (user.name || "U")
      .charAt(0)
      .toUpperCase();

    return `

      <div class="card">

        <div class="user">

          <div class="avatar">${initial}</div>

          <div>
            <div class="name">
              ${safe(user.name || "NEXA User")}
            </div>

            <div class="location">
              📍 ${safe(user.location || "Unknown")}
            </div>
          </div>

        </div>

        <div class="bio">
          ${safe(user.bio || "NEXA member")}
        </div>

        <div class="buttons">

          <button
            class="primary"
            onclick="openChat('${user.id}','${safeAttr(user.name)}')">
            💬 Chat
          </button>

        </div>

      </div>

    `;

  }).join("");
}


/* =========================
   SEARCH
========================= */

function searchUsers(){

  const q=
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  if(!q){

    displayUsers(profiles);
    return;
  }

  const result=
    profiles.filter(user=>
      (user.name||"").toLowerCase().includes(q) ||
      (user.location||"").toLowerCase().includes(q) ||
      (user.bio||"").toLowerCase().includes(q)
    );

  displayUsers(result);
}


/* =========================
   MY PROFILE
========================= */

async function loadMyProfile(){

  const box=document.getElementById("myProfile");

  const {data:{user}} =
    await supabaseClient.auth.getUser();

  if(!user){

    box.innerHTML=`

      <div class="empty">

        You are not logged in.

        <br><br>

        <button
          class="primary"
          onclick="showPage('login')">
          Login
        </button>

      </div>

    `;

    return;
  }

  const {data,error} =
    await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(error){

    box.innerHTML=
      '<div class="empty">Profile not found.</div>';

    return;
  }

  const initial=
    (data.name||"U")
    .charAt(0)
    .toUpperCase();

  box.innerHTML=`

    <div class="profile">

      <div class="bigavatar">${initial}</div>

      <h2>${safe(data.name)}</h2>

      <p>📧 ${safe(data.email||user.email)}</p>

      <p>📍 ${safe(data.location||"Not specified")}</p>

      <p>${safe(data.bio||"No bio yet.")}</p>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  `;
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  showPage("home");
}


/* =========================
   CHAT
========================= */

let currentReceiver=null;
let currentChannel=null;


async function openChat(id,name){

  const {data:{user}} =
    await supabaseClient.auth.getUser();

  if(!user){

    alert("Please login first.");
    showPage("login");
    return;
  }

  if(user.id===id){

    alert("You cannot chat with yourself.");
    return;
  }

  currentReceiver=id;

  document.getElementById("chatUserName").innerHTML=
    "<b>"+safe(name)+"</b>";

  showPage("chat");

  await loadMessages();

  if(currentChannel){

    await supabaseClient
      .removeChannel(currentChannel);
  }

  currentChannel=
    supabaseClient
    .channel("chat-"+user.id+"-"+id)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload=>{

        const m=payload.new;

        if(
          (m.sender_id===user.id &&
           m.receiver_id===id)
          ||
          (m.sender_id===id &&
           m.receiver_id===user.id)
        ){

          loadMessages();
        }

      }
    )
    .subscribe();
}


async function loadMessages(){

  const box=
    document.getElementById("chatMessages");

  const {data:{user}} =
    await supabaseClient.auth.getUser();

  if(!user || !currentReceiver)return;

  const {data,error} =
    await supabaseClient
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${user.id},receiver_id.eq.${currentReceiver}),and(sender_id.eq.${currentReceiver},receiver_id.eq.${user.id})`
    )
    .order("created_at",{ascending:true});

  if(error){

    box.innerHTML=
      '<div class="empty">Could not load messages.</div>';

    console.error(error);
    return;
  }

  if(!data.length){

    box.innerHTML=
      '<div class="empty">No messages yet. Say hello! 👋</div>';

    return;
  }

  box.innerHTML=data.map(m=>`

    <div class="bubble ${
      m.sender_id===user.id ? "mine" : "theirs"
    }">
      ${safe(m.message)}
    </div>

  `).join("");

  box.scrollTop=box.scrollHeight;
}


async function sendMessage(){

  const input=document.getElementById("chatInput");
  const text=input.value.trim();

  if(!text || !currentReceiver)return;

  const {data:{user}} =
    await supabaseClient.auth.getUser();

  if(!user){

    showPage("login");
    return;
  }

  const {error} =
    await supabaseClient
    .from("messages")
    .insert({
      sender_id:user.id,
      receiver_id:currentReceiver,
      message:text
    });

  if(error){

    alert(error.message);
    return;
  }
